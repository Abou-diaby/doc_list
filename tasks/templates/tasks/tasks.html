<div id="tasks" class="d-flex flex-column gap-2 mt-2">
{% if tasks %}
	<h2>{{ collection.name }}</h2>
{% endif %}
{% for task in tasks %}
    	{% include 'tasks/task.html' with task=task %}
{% endfor %}
</div>
{% if collection.slug != "defaut" %}
	<a href="{% url 'delete-collection' collection.pk %}">Supprimer cette collection</a>
{% endif %}
